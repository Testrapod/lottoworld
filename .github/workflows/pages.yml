name: Update lotto data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: Saturday 12:17/13:17 = KST Saturday 21:17/22:17
    - cron: '17 12,13 * * 6'
    # UTC: Saturday 22:17 = KST Sunday 07:17
    - cron: '17 22 * * 6'

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Testrapod/lottoworld'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm test
      - name: Fetch and validate official results
        run: npm run update-data
      - run: npm run check-data
      - name: Save changed data
        id: commit
        run: |
          git add -- data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update official lotto results'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.KAKAO_MAP_JAVASCRIPT_KEY }}
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
