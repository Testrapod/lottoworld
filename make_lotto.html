<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="로또 최신 당첨번호, 번호 생성기, 회차별 통계와 판매점 찾기">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <title>번호 생성기 | Lotto World</title>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header id="title"><h1><a href="index.html">Lotto World</a></h1></header>
  <nav id="navi" class="container" aria-label="주 메뉴">
    <a href="index.html">홈</a> · <a href="make_lotto.html">번호 생성기</a> · <a href="lotto_statistic.html">통계</a> · <a href="comment.html">댓글달기</a>
  </nav>
  <main id="main" class="container">
    <p id="data-status" class="data-status" role="status">당첨 데이터를 불러오고 있습니다…</p>
    <section class="panel hero"><h2>로또 번호 생성기</h2>
      <div class="actions"><label for="select_lotto_count">생성할 세트 수</label><select id="select_lotto_count"><option value="1">1세트</option><option value="2">2세트</option><option value="3">3세트</option><option value="4">4세트</option><option value="5">5세트</option></select><button id="make_lotto_btn" class="btn btn-success">로또 번호 생성</button><button id="make_img_btn" class="btn btn-primary" disabled>이미지로 저장</button></div>
      <p id="generator-status" role="status">1~5세트를 생성한 뒤 이미지로 저장할 수 있습니다.</p><div id="generated-rows" aria-live="polite"></div>
    </section>
    <section class="panel hero"><h2>통계 기반 로또 번호 추출</h2><p>과거 본번호의 출현 횟수를 가중치로 사용합니다. 낮은 빈도 우선은 출현 횟수의 역수를 사용합니다.</p><p class="muted">추첨은 매회 독립적이며, 이 방식이 당첨 확률을 높이지는 않습니다.</p>
      <div id="weighted-balls" class="balls" aria-live="polite"></div><p id="weighted-state" role="status">통계를 불러오면 사용할 수 있습니다.</p>
      <div class="actions"><button id="weighted_random_high_freq_btn" class="btn btn-danger" disabled>빈도수 높은 번호 우선</button><button id="weighted_random_low_freq_btn" class="btn btn-danger" disabled>빈도수 낮은 번호 우선</button></div>
    </section>
  </main>
  <footer class="container"></footer>
  <noscript><p class="container">번호 조회와 댓글 기능을 사용하려면 JavaScript를 활성화해주세요.</p></noscript>
  <script type="module" src="js/make_lotto_ready.js"></script>
</body>
</html>
