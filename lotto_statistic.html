<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="로또 최신 당첨번호, 번호 생성기, 회차별 통계와 판매점 찾기">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <title>로또 통계 | Lotto World</title>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header id="title"><h1><a href="index.html">Lotto World</a></h1></header>
  <nav id="navi" class="container" aria-label="주 메뉴">
    <a href="index.html">홈</a> · <a href="make_lotto.html">번호 생성기</a> · <a href="lotto_statistic.html">통계</a> · <a href="comment.html">댓글달기</a>
  </nav>
  <main id="main" class="container">
    <p id="data-status" class="data-status" role="status">당첨 데이터를 불러오고 있습니다…</p>
    <section class="panel hero"><h2>지난 회차 로또번호 확인</h2><div class="actions"><label for="select_lotto_number">회차</label><select id="select_lotto_number" disabled><option>불러오는 중</option></select><button id="search_lotto_btn" class="btn btn-success" disabled>확인하기</button></div><p id="select_lotto_date"></p><div id="history-balls" class="balls" aria-live="polite"></div></section>
    <section class="panel"><h2>번호별 빈도수</h2><p id="frequency-caption" class="muted"></p><div id="number_frequency_chart" class="frequency-chart" aria-label="번호별 출현 횟수"></div></section>
    <section class="panel hero"><h2>번호 분석하기</h2><p>입력한 번호와 과거 본번호를 비교해 3개 이상 같은 회차를 보여줍니다. 보너스 번호는 제외합니다.</p><form id="analysis-form" novalidate><div class="number-inputs"><label><span class="sr-only">1번째 번호</span><input type="number" inputmode="numeric" min="1" max="45" step="1" required aria-label="1번째 번호" placeholder="1"></label><label><span class="sr-only">2번째 번호</span><input type="number" inputmode="numeric" min="1" max="45" step="1" required aria-label="2번째 번호" placeholder="2"></label><label><span class="sr-only">3번째 번호</span><input type="number" inputmode="numeric" min="1" max="45" step="1" required aria-label="3번째 번호" placeholder="3"></label><label><span class="sr-only">4번째 번호</span><input type="number" inputmode="numeric" min="1" max="45" step="1" required aria-label="4번째 번호" placeholder="4"></label><label><span class="sr-only">5번째 번호</span><input type="number" inputmode="numeric" min="1" max="45" step="1" required aria-label="5번째 번호" placeholder="5"></label><label><span class="sr-only">6번째 번호</span><input type="number" inputmode="numeric" min="1" max="45" step="1" required aria-label="6번째 번호" placeholder="6"></label></div><button id="number_analysis_btn" class="btn btn-danger" disabled>로또 번호 분석</button></form><p id="analysis-status" role="status"></p>
    <div class="table-scroll"><table id="number_analysis_table" hidden><thead><tr><th scope="col">회차</th><th scope="col">로또 번호</th><th scope="col">일치한 본번호</th></tr></thead><tbody></tbody></table></div></section>
  </main>
  <footer class="container"></footer>
  <noscript><p class="container">번호 조회와 댓글 기능을 사용하려면 JavaScript를 활성화해주세요.</p></noscript>
  <script type="module" src="js/lotto_statistic_ready.js"></script>
</body>
</html>
